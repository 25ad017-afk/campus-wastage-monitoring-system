<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" style="background: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
