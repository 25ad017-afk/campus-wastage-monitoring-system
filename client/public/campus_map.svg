      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="mainBlockGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="academicGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="hostelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="amenityGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sportsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="utilityGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background / Campus Perimeter -->
  <rect width="1600" height="1000" fill="url(#bgGrad)" />
  
  <!-- Campus Boundary Fence -->
  <rect x="25" y="25" width="1550" height="950" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="12 6" filter="url(#dropShadow)"/>

  <!-- Green Lawns / Landscaping Areas -->
  <path d="M 50 110 L 530 110 L 530 280 L 50 280 Z" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" rx="12"/>
  <path d="M 1070 110 L 1550 110 L 1550 280 L 1070 280 Z" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" rx="12"/>
  <path d="M 50 530 L 530 530 L 530 840 L 50 840 Z" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" rx="12"/>
  <path d="M 1030 530 L 1550 530 L 1550 840 L 1030 840 Z" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" rx="12"/>

  <!-- Main Ring Road & Walkways -->
  <path d="M 100 450 L 1500 450 M 560 80 L 560 920 M 1010 80 L 1010 920" stroke="#e2e8f0" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 100 450 L 1500 450 M 560 80 L 560 920 M 1010 80 L 1010 920" stroke="#94a3b8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 100 450 L 1500 450 M 560 80 L 560 920 M 1010 80 L 1010 920" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="14 10" fill="none"/>

  <!-- Secondary Pathways -->
  <path d="M 280 260 L 280 640 M 785 100 L 785 900 M 1280 260 L 1280 640" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round" fill="none"/>

